name: FTP Deploy

on:
  push:
    branches: [master]

# Avoid two deploys racing against the same FTP state file if two pushes land close together
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy theme to FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy config/
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./config/
          server-dir: /config/
          exclude: |
            **/.DS_Store

      - name: Deploy layouts/
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./layouts/
          server-dir: /layouts/
          exclude: |
            **/.DS_Store

      - name: Deploy snipplets/
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./snipplets/
          server-dir: /snipplets/
          exclude: |
            **/.DS_Store

      # static/ não usa a FTP-Deploy-Action: a sincronização dela apaga o
      # gaius-v{epoch}.js antigo a cada build novo (ADR-0007) e o FTP da
      # Nuvemshop recusa o DELE, derrubando o job. O script só sobe e
      # sobrescreve, nunca apaga — bundles antigos ficam órfãos no FTP.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Deploy static/
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node scripts/ftp-deploy.mjs static

      - name: Deploy templates/
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./templates/
          server-dir: /templates/
          exclude: |
            **/.DS_Store
